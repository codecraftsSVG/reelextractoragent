databases:
  - name: reeldb
    plan: free
    databaseName: reel
    user: reeluser

services:
  - type: web
    name: reel-extractor
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reeldb
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: reel-storage
      mountPath: /app/storage
      sizeGB: 1



