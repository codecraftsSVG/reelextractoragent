services:
  - type: web
    name: reel-extractor
    env: docker
    image: ghcr.io/codecraftsSVG/reelextractoragent:latest
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: COOKIES_TXT
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./storage/reel.db"
    disk:
      name: reel-storage
      mountPath: /app/storage
      sizeGB: 1
