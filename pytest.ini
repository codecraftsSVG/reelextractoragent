[pytest]
testpaths = tests
python_files = test_*.py
# -p no:phoenix: the globally site-packages'd arize-phoenix pytest plugin has a
# broken pydantic import and crashes pytest at plugin load; it is not used here.
addopts = -ra -q -p no:phoenix
markers =
    unit: pure unit tests, no I/O
    api: FastAPI TestClient tests
    integration: multi-module integration
    live: requires network / deployed Render / Neon / cookies
