name: CI + CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install system deps (ffmpeg, tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Run unit / api / integration tests (no network)
        run: pytest -m "unit or api or integration"

      - name: Run live smoke tests (opt-in)
        if: vars.LIVE_TESTS == '1'
        env:
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          DATABASE_URL: ${{ secrets.LIVE_DATABASE_URL }}
        run: pytest -m live

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # --- NEW: Build & Push Docker Image to GHCR ---
  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- NEW: Deploy to Render via API (resolve service ID by name) ---
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # Live service is reel-extractor -> reelextractoragent-wr3s; override via
      # repo variable RENDER_SERVICE_NAME if the service is ever renamed.
      RENDER_SERVICE_NAME: ${{ vars.RENDER_SERVICE_NAME || 'reelextractoragent' }}
    steps:
      - name: Resolve Render service ID
        id: resolve
        run: |
          SERVICES=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?limit=50")
          # Match by exact service name OR by URL slug (e.g. reelextractoragent
          # matches https://reelextractoragent-wr3s.onrender.com).
          SERVICE_ID=$(echo "$SERVICES" | jq -r \
            ".[] | select(.service.name == \"$RENDER_SERVICE_NAME\" or ((.service.serviceDetails.url // \"\") | test(\"$RENDER_SERVICE_NAME\"))) | .service.id" | head -n1)
          if [ -z "$SERVICE_ID" ] || [ "$SERVICE_ID" = "null" ]; then
            echo "Could not find Render service named or slug '$RENDER_SERVICE_NAME'"
            echo "$SERVICES" | jq -r '.[] | "  \(.service.name) -> \(.service.serviceDetails.url // "?")"'
            exit 1
          fi
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved service ID: $SERVICE_ID"

      - name: Trigger Render deploy
        id: trigger
        env:
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          echo "Deploying image: $IMAGE"
          DEPLOY_RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}")
          DEPLOY_ID=$(echo "$DEPLOY_RESPONSE" | jq -r '.id')
          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Deploy trigger failed: $DEPLOY_RESPONSE"
            exit 1
          fi
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy ID: $DEPLOY_ID"

      - name: Poll deploy status until live/failed
        env:
          SERVICE_ID: ${{ steps.resolve.outputs.service_id }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          TIMEOUT=600   # 10 minutes
          INTERVAL=15
          ELAPSED=0
          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "Deploy status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "Deploy succeeded."; exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "Deploy failed."; exit 1
            fi
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Deploy timed out after ${TIMEOUT}s."; exit 1

      - name: Smoke test the live service
        if: success()
        env:
          LIVE_BASE_URL: ${{ vars.LIVE_BASE_URL || 'https://reelextractoragent-wr3s.onrender.com' }}
        run: |
          HEALTH=$(curl --fail --silent --show-error "$LIVE_BASE_URL/health")
          echo "$HEALTH" | jq -e '.status == "ok"'
          JOBS=$(curl --fail --silent --show-error "$LIVE_BASE_URL/jobs")
          echo "$JOBS" | jq -e 'type == "array"'

  # --- OPTIONAL: Manual post-deploy smoke check ---
  deploy-check:
    if: github.event_name == 'workflow_dispatch'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe deployed service
        env:
          LIVE_BASE_URL: ${{ vars.LIVE_BASE_URL || 'https://reelextractoragent-wr3s.onrender.com' }}
        run: |
          HEALTH=$(curl --fail --silent --show-error "$LIVE_BASE_URL/health")
          echo "$HEALTH" | jq -e '.status == "ok"'
          JOBS=$(curl --fail --silent --show-error "$LIVE_BASE_URL/jobs")
          echo "$JOBS" | jq -e 'type == "array"'
